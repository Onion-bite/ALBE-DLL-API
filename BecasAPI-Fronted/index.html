<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Becas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Buscador de Becas</h1>
            <p>Encuentra becas disponibles según tu carrera</p>
        </header>

        <main>
            <div class="search-section">
                <label for="carrera">Selecciona tu carrera:</label>
                <select id="carrera">
                    <option value="">-- Elige una carrera --</option>
                    <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                    <option value="Gestión de Programas">Gestión de Programas</option>
                    <option value="Arquitectura de Hardware">Arquitectura de Hardware</option>
                    <option value="Ciberseguridad">Ciberseguridad</option>
                    <option value="Estudiantes de educación superior técnica">Estudiantes de educación superior técnica</option>
                    <option value="Licenciatura">Licenciatura</option>
                    <option value="Posgrado">Posgrado</option>
                    <option value="Doctorado">Doctorado</option>
                    <option value="Ciencias de la Computación">Ciencias de la Computación</option>
                    <option value="Desarrollo de Videojuegos">Desarrollo de Videojuegos</option>
                    <option value="Estructuras de Datos">Estructuras de Datos</option>
                    <option value="Ing. industrial">Ing. industrial</option>
                </select>
                <button onclick="buscarBecas()">Buscar</button>
            </div>

            <div id="loading" class="loading hidden">
                Cargando becas...
            </div>

            <div id="resultados" class="resultados"></div>
        </main>

        <footer>
            <p>API de Becas UPN © 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
